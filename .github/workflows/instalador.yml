name: Instalador

# Gera o instalador completo (app + Tesseract OCR + LibreOffice) numa VM Windows limpa do GitHub, instala-o
# como um usuário faria e roda a verificação da instalação (planilha, geração das folhas, PDF, OCR, e-mail).
# A VM não tem Microsoft Office nem Tesseract: o que funcionar aqui veio do instalador.
# Baixe o instalador em Actions > Instalador > (execução) > Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "folha_ponto/**"
      - "installer/**"
      - "recursos/**"
      - "main.py"
      - "build_exe.py"
      - "requirements.txt"
      - ".github/workflows/instalador.yml"

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Testes
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -t .

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress }
          Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue

      - name: Gerar instalador
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          $log = "$env:RUNNER_TEMP\gerar.log"
          python installer/gerar_instalador.py 2>&1 | Tee-Object -FilePath $log
          $codigo = $LASTEXITCODE
          if ($codigo -ne 0) {
            # o fim do log vira uma anotação (visível no resumo da execução, mesmo sem abrir o log)
            $fim = (Get-Content $log -Tail 40 | ForEach-Object { $_ -replace '%', '%25' }) -join '%0A'
            Write-Output "::error title=Gerar instalador::$fim"
            exit $codigo
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DIGEP_Folha_de_Ponto_Setup
          path: installer/output/DIGEP_Folha_de_Ponto_Setup.exe
          if-no-files-found: error

      - name: Instalar como um usuário
        shell: pwsh
        run: |
          $destino = "$env:RUNNER_TEMP\DIGEP"
          $p = Start-Process installer\output\DIGEP_Folha_de_Ponto_Setup.exe -Wait -PassThru `
               -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$destino`"", "/LOG=`"$env:RUNNER_TEMP\instalacao.log`""
          Get-Content "$env:RUNNER_TEMP\instalacao.log" -Tail 30
          if ($p.ExitCode -ne 0) { throw "Instalador terminou com código $($p.ExitCode)" }
          foreach ($f in "DIGEP_Folha_de_Ponto.exe", "Tesseract-OCR\tesseract.exe", "Tesseract-OCR\tessdata\por.traineddata", "LibreOffice\program\soffice.exe") {
            if (-not (Test-Path "$destino\$f")) { throw "Faltou no instalado: $f" }
          }
          "DESTINO=$destino" >> $env:GITHUB_ENV

      - name: Verificar a instalação (só com o que o instalador colocou)
        shell: pwsh
        run: |
          # PATH só com o Windows: sem o Python, o 7-Zip e as ferramentas do runner
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Remove-Item Env:TESSDATA_PREFIX -ErrorAction SilentlyContinue
          $relatorio = "$env:RUNNER_TEMP\verificacao.txt"
          $p = Start-Process "$env:DESTINO\DIGEP_Folha_de_Ponto.exe" -Wait -PassThru `
               -ArgumentList "--verificar", "`"$relatorio`"", "--silencioso"
          Get-Content $relatorio
          if ($p.ExitCode -ne 0) { throw "A verificação da instalação falhou (código $($p.ExitCode))" }
          if (Select-String -Path $relatorio -Pattern "^\[(FALHA|AVISO)\]") { throw "A verificação apontou problemas" }
          $libre = [regex]::Escape("$env:DESTINO\LibreOffice")
          if (-not (Select-String -Path $relatorio -Pattern "pelo LibreOffice \($libre")) { throw "O PDF não foi gerado pelo LibreOffice embutido" }

      - name: Conferir que nada depende de algo de fora do Windows
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # Toda DLL que o .exe, o Tesseract e o LibreOffice instalados importam tem de estar no pacote ou no
          # Windows 10/11: o runtime do Visual C++ e afins desta VM não existem num Windows novo.
          $saida = python installer/conferir_dependencias.py "$env:DESTINO" 2>&1
          $saida
          $codigo = $LASTEXITCODE
          $texto = ($saida | ForEach-Object { "$_" -replace '%', '%25' }) -join '%0A'
          if ($codigo -ne 0) { Write-Output "::error title=Dependências::$texto"; exit $codigo }
          Write-Output "::notice title=Dependências::$texto"

      - name: Abrir a interface
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Start-Process "$env:DESTINO\DIGEP_Folha_de_Ponto.exe" -WorkingDirectory $env:DESTINO
          # o .exe do PyInstaller abre o programa num processo filho: procura a janela em qualquer um deles
          $janela = $null
          for ($i = 0; $i -lt 90 -and -not $janela; $i++) {
            Start-Sleep -Seconds 1
            $janela = Get-Process -Name DIGEP_Folha_de_Ponto -ErrorAction SilentlyContinue |
                      Where-Object { $_.MainWindowTitle -like "*(UnDF)*" } | Select-Object -First 1
            $erro = Get-Process -Name DIGEP_Folha_de_Ponto -ErrorAction SilentlyContinue |
                    Where-Object { $_.MainWindowTitle -and $_.MainWindowTitle -notlike "*(UnDF)*" } | Select-Object -First 1
            if ($erro) { throw "Abriu uma janela inesperada: '$($erro.MainWindowTitle)'" }
          }
          if (-not $janela) { throw "A janela principal do DIGEP não abriu em 90 s" }
          Start-Sleep -Seconds 10  # continua aberta depois de montar as telas?
          $janela.Refresh()
          if ($janela.HasExited) { throw "O DIGEP fechou sozinho depois de abrir" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $tela = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $imagem = New-Object System.Drawing.Bitmap $tela.Width, $tela.Height
          [System.Drawing.Graphics]::FromImage($imagem).CopyFromScreen($tela.Location, [System.Drawing.Point]::Empty, $tela.Size)
          $imagem.Save("$env:RUNNER_TEMP\interface.png")
          Write-Output "::notice title=Interface::Janela '$($janela.MainWindowTitle)' aberta e respondendo: $($janela.Responding)"
          if (-not $janela.Responding) { throw "A janela do DIGEP não está respondendo" }
          Get-Process -Name DIGEP_Folha_de_Ponto | Stop-Process -Force
          if (-not (Test-Path "$env:DESTINO\folha_ponto.db")) { throw "O banco de dados não foi criado na pasta instalada" }

      - name: Relatório da verificação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacao
          path: |
            ${{ runner.temp }}/verificacao.txt
            ${{ runner.temp }}/instalacao.log
            ${{ runner.temp }}/interface.png
          if-no-files-found: ignore
